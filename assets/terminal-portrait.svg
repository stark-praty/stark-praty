<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="900" viewBox="0 0 720 900">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset="1" stop-color="#17122b"/></linearGradient>
  <pattern id="glyphs" width="42" height="24" patternUnits="userSpaceOnUse">
    <text x="0" y="18" font-family="monospace" font-size="18" font-weight="bold" letter-spacing="1" fill="#d9d0ff">.-.-..--.-.</text>
  </pattern>
  <filter id="darkMask" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="
      0.2126 0.7152 0.0722 0 0
      0.2126 0.7152 0.0722 0 0
      0.2126 0.7152 0.0722 0 0
      -0.2126 -0.7152 -0.0722 0 1"/>
  </filter>
  <mask id="portraitMask" maskUnits="userSpaceOnUse" x="0" y="0" width="720" height="900">
    <image x="0" y="0" width="720" height="900" preserveAspectRatio="xMidYMid slice" xlink:href="https://stark-praty.github.io/portfolio/images/A11.jpg" filter="url(#darkMask)"/>
  </mask>
</defs>
<rect width="720" height="900" fill="url(#bg)"/>
<rect width="720" height="900" fill="url(#glyphs)" mask="url(#portraitMask)"/>
<rect x="12" y="12" width="696" height="876" rx="16" fill="none" stroke="#7764c8" stroke-opacity=".45" stroke-width="2"/>
</svg>