<text x="52" y="158" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="800" letter-spacing="2" fill="none" stroke="#a78bfa" stroke-opacity=".18" stroke-width="1">PRATYUSH GARG</text>
