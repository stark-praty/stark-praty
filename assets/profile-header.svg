  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#b9a8ff"/><path d="M6 2h4" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/></pattern>
  <clipPath id="nameClip"><text x="55" y="143" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" letter-spacing="1">PRATYUSH GARG</text></clipPath>
