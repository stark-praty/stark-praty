<text x="55" y="143" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="800" letter-spacing="1" fill="none" stroke="#9c8cff" stroke-opacity=".18" stroke-width="1">PRATYUSH GARG</text>
<text x="58" y="195" fill="#d7e4f5" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="2">FOUNDER  ·  SOFTWARE ENGINEER  ·  AI BUILDER</text>
<text x="58" y="232" fill="#9fb2c9" font-family="Arial,Helvetica,sans-serif" font-size="18">Python  /  AI &amp; ML  /  Full-Stack  /  Data  /  Cloud  /  Automation</text>
